name: Build Duck Trap

# Build Duck Trap into ready-to-run files for Windows and macOS.
# - Manual: Actions tab -> Build Duck Trap -> Run workflow
# - Or automatically on a v1.0.0-style tag (also creates a downloadable Release).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DuckTrap-Windows
          - os: macos-latest
            artifact: DuckTrap-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller packaging/DuckTrap.spec --noconfirm

      - name: Zip the macOS .app with ditto (Archive Utility can expand it)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent DuckTrap.app DuckTrap-macOS.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/DuckTrap.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/DuckTrap-macOS.zip

      - name: Attach to Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DuckTrap.exe
            dist/DuckTrap-macOS.zip
